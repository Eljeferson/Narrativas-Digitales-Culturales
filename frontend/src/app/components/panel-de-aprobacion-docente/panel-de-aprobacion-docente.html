<main class="min-h-screen bg-background px-4 py-6 text-on-surface md:px-10">
  <section class="mx-auto max-w-7xl">
    <header class="mb-8">
      <p class="text-xs font-bold uppercase tracking-widest text-tertiary">HU-11 y HU-12 · Revisión docente</p>
      <h1 class="font-headline text-4xl font-bold text-primary">Aprobación y retroalimentación</h1>
      <p class="mt-2 text-on-surface-variant">Selecciona fragmentos, comenta con fecha y decide si una narrativa se publica.</p>
    </header>

    <section class="grid gap-5 lg:grid-cols-2">
      <article *ngFor="let item of items" class="rounded-lg border border-outline-variant bg-surface-container-lowest p-5 shadow-sm">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-headline text-2xl font-bold text-primary">{{ item.title }}</h2>
            <p class="text-sm text-on-surface-variant">{{ item.author }} · {{ item.culture }}</p>
          </div>
          <span class="rounded bg-secondary-container px-2 py-1 text-xs font-bold text-on-secondary-container">{{ item.status }}</span>
        </div>

        <p class="rounded-lg bg-surface-container p-4 leading-relaxed" contenteditable="true">{{ item.fragment }}</p>

        <div class="mt-4 grid gap-3">
          <textarea [(ngModel)]="newComment" rows="2" class="rounded-lg border border-outline-variant bg-surface px-3 py-2" placeholder="Comentario sobre el fragmento seleccionado"></textarea>
          <button type="button" (click)="addComment(item)" class="rounded-lg border border-outline-variant px-4 py-2 font-bold text-primary">Añadir comentario</button>
          <div *ngFor="let comment of item.comments" class="rounded bg-tertiary/10 px-3 py-2 text-sm text-tertiary">{{ comment }}</div>
        </div>

        <div class="mt-4">
          <textarea [(ngModel)]="feedback" rows="2" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" placeholder="Motivo para el estudiante"></textarea>
          <div class="mt-3 flex flex-wrap gap-2">
            <button type="button" (click)="decide(item, 'Aprobada')" class="rounded-lg bg-tertiary px-4 py-2 font-bold text-on-tertiary">Aprobar</button>
            <button type="button" (click)="decide(item, 'Solicita revisión')" class="rounded-lg bg-primary px-4 py-2 font-bold text-on-primary">Solicitar revisión</button>
            <button type="button" (click)="decide(item, 'Rechazada')" class="rounded-lg border border-error px-4 py-2 font-bold text-error">Rechazar</button>
          </div>
          <p *ngIf="item.reason" class="mt-3 text-sm text-on-surface-variant">Notificación enviada: {{ item.reason }}</p>
        </div>
      </article>
    </section>
  </section>
</main>
