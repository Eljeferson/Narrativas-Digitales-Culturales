<main class="min-h-screen bg-background px-4 py-6 text-on-surface md:px-10">
  <section class="mx-auto max-w-4xl rounded-lg border border-outline-variant bg-surface-container-lowest p-6 shadow-sm md:p-10">
    <p class="text-xs font-bold uppercase tracking-widest text-tertiary">HU-15 · Publicación estudiantil</p>
    <h1 class="font-headline text-4xl font-bold text-primary">Publicar narrativa aprobada</h1>
    <p class="mt-2 text-on-surface-variant">Solo las narrativas aprobadas aparecen en el repositorio escolar público.</p>

    <div class="mt-6 rounded-lg bg-surface-container p-5">
      <h2 class="font-headline text-2xl font-bold text-primary">El eco de los Apus</h2>
      <p class="mt-1 text-sm text-on-surface-variant">Estado docente: Aprobada</p>
      <button type="button" (click)="publish()" [disabled]="published" class="mt-4 rounded-lg bg-primary px-5 py-3 font-bold text-on-primary disabled:opacity-50">
        {{ published ? 'Publicado en repositorio' : 'Publicar con un clic' }}
      </button>
    </div>

    <div *ngIf="published" class="mt-6 rounded-lg bg-tertiary/10 p-5 text-tertiary">
      <p class="font-bold">Badge desbloqueado: Autor Publicado</p>
      <p class="mt-1">Lecturas actuales: {{ reads }}</p>
    </div>
  </section>
</main>
